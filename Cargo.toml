[package]
name = "daydoc"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Decision-first office notes. Notes are evidence; decisions are the record."
license = "MIT OR Apache-2.0"
repository = "https://github.com/drsamonline/DayDoc"
readme = "README.md"

[lib]
name = "daydoc"
path = "src/lib.rs"

[[bin]]
name = "daydoc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argh = "0.1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
ulid = "1"
yaml-rust2 = "0.9"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
