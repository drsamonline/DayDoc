[package]
name = "daydoc"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Decision-first office notes. Notes are evidence; decisions are the record."
license = "MIT"
repository = "https://github.com/drsamonline/DayDoc"
readme = "README.md"

[lib]
name = "daydoc"
path = "src/lib.rs"

[[bin]]
name = "daydoc"
path = "src/main.rs"

[features]
default = ["git", "ui", "keychain", "mobile"]
git = ["dep:git2"]
ui = ["dep:eframe", "dep:global-hotkey"]
mobile = ["dep:axum", "dep:tokio"]
keychain = ["dep:keyring"]

[dependencies]
anyhow = "1"
argh = "0.1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"], optional = true }
eframe = { version = "0.29", optional = true }
global-hotkey = { version = "0.10", optional = true }
keyring = { version = "3", default-features = false, features = ["linux-native", "windows-native"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
git2 = { version = "0.20", default-features = false, optional = true }
notify = { version = "6", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
ring = { version = "0.17", default-features = false, features = ["alloc", "std"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
thiserror = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros"], optional = true }
ulid = "1"
yaml-rust2 = "0.9"

[package.metadata.deb]
maintainer = "DayDoc maintainers"
copyright = "2026, DayDoc maintainers"
extended-description = "Decision-first office notes. Notes are evidence; decisions are the record."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/daydoc", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/daydoc/README.md", "644"],
]

[dev-dependencies]
serde_json = "1"
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
