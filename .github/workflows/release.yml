name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not `ubuntu-latest`: a binary built on the newest glibc only
          # runs on that glibc. 22.04 gives a floor of 2.35, which covers Debian
          # 12, Ubuntu 22.04 and later, and anything newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Static, so it does not care about glibc at all.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install build tooling
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: test before packaging
        run: cargo test --all-targets
      - name: package and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: daydoc
          target: ${{ matrix.target }}
          archive: daydoc-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  deb:
    name: debian package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deb
        run: cargo install cargo-deb --locked
      - name: build .deb
        run: cargo deb
      - name: upload .deb
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
