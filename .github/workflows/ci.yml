name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
        continue-on-error: true
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: build
        run: cargo build --all-targets
      - name: build the core alone
        run: cargo build --no-default-features
        if: matrix.os == 'ubuntu-latest'
      - name: test the core alone
        run: cargo test --no-default-features --lib
        if: matrix.os == 'ubuntu-latest'
      - name: demo script
        run: |
          export DAYDOC=./target/debug/daydoc
          bash scripts/demo.sh /tmp/daydoc-demo
        if: matrix.os == 'ubuntu-latest'
      - name: test
        run: cargo test --all-targets
      - name: release build
        run: cargo build --release

  packaging:
    name: debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deb
        run: cargo install cargo-deb --locked
      - name: build the .deb
        run: cargo deb
      - name: show what was built
        run: ls -l target/debian/*.deb

  compat:
    name: runs on an older glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built where the release is built, then run where the release is *not*
      # built. 0.2.0 shipped a binary that needed GLIBC_2.43 and nobody noticed
      # until it was downloaded and started.
      - name: build the release binary
        run: cargo build --release
      - name: run it on debian 12
        run: |
          docker run --rm \
            -v "$PWD/target/release/daydoc:/usr/local/bin/daydoc:ro" \
            debian:12 \
            bash -c 'set -e
              daydoc --help > /dev/null
              daydoc init /tmp/v > /dev/null
              daydoc -v /tmp/v capture "we decided to adopt okta for sso" > /dev/null
              daydoc -v /tmp/v ask "what did we decide about okta" | head -2
              daydoc -v /tmp/v status | tail -3
              echo "the release binary runs on debian 12"'

  model:
    name: the model matches onnxruntime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 86 MB, downloaded every run. It is the only way to know that the Rust
      # inference produces the same numbers as the reference, and it is cheap
      # next to shipping an embedder that quietly disagrees.
      - name: fetch all-MiniLM-L6-v2
        run: bash scripts/fetch-model.sh "$PWD/models"
      - name: compare against the reference
        run: cargo test --test minilm -- --nocapture
        env:
          DAYDOC_MODEL_DIR: ${{ github.workspace }}/models
